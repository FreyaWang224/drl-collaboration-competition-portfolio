[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "drl-collaboration-competition-portfolio"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["torch==2.8.0", "numpy==2.0.2", "protobuf==3.20.3", "grpcio==1.80.0", "Pillow>=9", "matplotlib==3.9.4"]
[project.optional-dependencies]
dev = ["pytest==8.4.2"]
[project.scripts]
tennis = "tennis.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
